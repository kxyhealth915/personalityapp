<style>

    --bg: #f7f8fa;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --accent-dark: #1d4ed8;
    --pos: #16a34a;
    --pos-soft: #dcfce7;
    --neg: #dc2626;
    --neg-soft: #fee2e2;
    --warn: #d97706;
    --warn-soft: #fef3c7;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 1px 6px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    font-size: 15px;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 24px 40px 18px;
  }
  header h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  main { max-width: 920px; margin: 0 auto; padding: 32px 24px 80px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .card h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
  .card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .card .lede { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  button {
    font: inherit;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    font-weight: 500;
    transition: background .15s, transform .05s;
  }
  button:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled {
    background: #cbd5e1;
    cursor: not-allowed;
  }
  .btn-ghost {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--accent-soft); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .row.right { justify-content: flex-end; }
  .row.between { justify-content: space-between; }

  /* Progress bar */
  .progress-wrap {
    background: var(--border);
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    margin: 8px 0 16px;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    transition: width .25s;
  }
  .progress-label { font-size: 13px; color: var(--muted); }

    font-size: 16px;
    font-weight: 500;
    margin: 6px 0 18px;
    min-height: 50px;
  }
  .likert-scale {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin: 10px 0 18px;
  }
  .likert-scale.four { grid-template-columns: repeat(4, 1fr); }
  .likert-opt {
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 10px;
    padding: 14px 8px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: border-color .12s, background .12s;
  }
  .likert-opt:hover { border-color: var(--accent); }
  .likert-opt.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-dark);
    font-weight: 600;
  }
  .likert-opt .num { font-size: 17px; font-weight: 600; }

  .likert-opt.selected .lbl { color: var(--accent-dark); }

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 12px 0 6px;
  }
  .persona-opt {

    background: var(--card);

/* =====================================================================
   SCORING
   ===================================================================== */

function scoreInstrument(inst, responses) {
  // responses: array of integers, same length as inst.items
  const traits = {};
  inst.items.forEach((item, i) => {
    const v = responses[i];
    if (v == null) return;
    const top = inst.likert; // 4 or 5
    const scored = item.reverse ? (top + 1 - v) : v;
    if (!traits[item.trait]) traits[item.trait] = [];
    traits[item.trait].push(scored);
  });

  const out = {};
  for (const [trait, vals] of Object.entries(traits)) {
    const sum = vals.reduce((a, b) => a + b, 0);
    const mean = sum / vals.length;
    out[trait] = { mean: round(mean, 2), sum, n: vals.length };
  }

  // Add derived overall score for grit
  if (inst.id === 'grit' && out.perseverance && out.consistency) {
    out.overall = {
      mean: round((out.perseverance.mean + out.consistency.mean) / 2, 2),
      n: 8,
    };
  }

  // Apply band labels
  for (const trait of Object.keys(out)) {
    const norm = inst.norms?.[trait];
    if (!norm) continue;
    const useSum = norm.sum === true;
    const value = useSum ? out[trait].sum : out[trait].mean;
    out[trait].band = bandFor(value, norm);
    out[trait].pct = pctFor(value, norm, useSum, inst.likert);
  }
  return out;
}

function bandFor(value, norm) {
  // Low: < m - 0.5*sd ; Average: within ±0.5*sd ; High: > m + 0.5*sd
  if (value < norm.m - 0.5 * norm.sd) return 'low';
  if (value > norm.m + 0.5 * norm.sd) return 'high';
  return 'avg';
}

function pctFor(value, norm, useSum, likert) {
  // Map raw value to a 0–100 visual percentage.
  // For sum-scored: linear within min..max. For mean: linear within 1..likert.
  if (useSum) {
    return clamp(((value - norm.min) / (norm.max - norm.min)) * 100, 0, 100);
  }
  return clamp(((value - 1) / (likert - 1)) * 100, 0, 100);
}

function round(n, d) { const m = Math.pow(10, d); return Math.round(n * m) / m; }
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

function scoreVia(inst, responses) {
  // VIA: rank the 24 strengths; top 5 = signature strengths.
  const ranked = inst.items.map((it, i) => ({
    trait: it.trait,
    label: inst.traitLabels[it.trait],
    score: responses[i] ?? 0,
  })).sort((a, b) => b.score - a.score);
  return {
    ranked,
    top5: ranked.slice(0, 5),
    bottom5: ranked.slice(-5).reverse(),
  };
}

function resolveSignal(scores, key) {
  // key like 'bigFive.conscientiousness' or 'via.leadership'
  const [inst, trait] = key.split('.');
  if (inst === 'via') {
    const item = scores.via.ranked.find(r => r.trait === trait);
    if (!item) return null;
    // VIA items are Likert 1..5
    return { value: item.score, likert: 5, useSum: false };
  }
  const s = scores[inst]?.[trait];
  if (!s) return null;
  const norm = INSTRUMENTS[inst].norms?.[trait];
  const likert = INSTRUMENTS[inst].likert;
  const useSum = !!norm?.sum;
  const value = useSum ? s.sum : s.mean;
  return { value, likert, useSum, norm };
}

function themeScore(theme, scores) {
  // Each input contributes a 0..100 sub-score. Combine by weighted sum.
  let total = 0;
  let wsum = 0;
  const breakdown = [];
  for (const inp of theme.inputs) {
    const sig = resolveSignal(scores, inp.key);
    if (!sig) continue;
    let pct;
    if (sig.useSum && sig.norm) {
      pct = ((sig.value - sig.norm.min) / (sig.norm.max - sig.norm.min)) * 100;
    } else {
      pct = ((sig.value - 1) / (sig.likert - 1)) * 100;
    }
    pct = clamp(pct, 0, 100);
    const contrib = inp.dir === 1 ? pct : (100 - pct);
    total += contrib * inp.weight;
    wsum += inp.weight;
    breakdown.push({ key: inp.key, pct: round(contrib, 0), weight: inp.weight });
  }
  const score = wsum > 0 ? total / wsum : 0;
  // Weakest input = primary growth focus
  breakdown.sort((a, b) => a.pct - b.pct);
  return { score: round(score, 0), breakdown };
}

function themeInterpretation(scoreValue) {
  if (scoreValue >= 70) return { tag: 'Strong', tone: 'high' };
  if (scoreValue >= 45) return { tag: 'Developing', tone: 'avg' };
  return { tag: 'Growth area', tone: 'low' };
}

/* =====================================================================
   STORAGE — localStorage wrapper
   ===================================================================== */

const STORAGE_KEY = 'personality-app:v1';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function saveState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {}
}
function clearState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch {}
}

  view: 'welcome',          // welcome | runner | report
  persona: null,            // 'career' | 'business'
  reportTab: 'synthesis',   // synthesis | bigFive | grit | via | efficacy | loc
  instrumentIdx: 0,
  itemIdx: 0,
  responses: {              // keyed by instrument id, array of integers
    bigFive: [], grit: [], via: [], efficacy: [], loc: [],
  },
};

function persist() {
  saveState({
    persona: STATE.persona,
    instrumentIdx: STATE.instrumentIdx,
    itemIdx: STATE.itemIdx,
    responses: STATE.responses,
    view: STATE.view,
  });
}

function restore() {
  const s = loadState();
  if (!s) return false;
  if (s.persona)        STATE.persona = s.persona;
  if (s.responses)      STATE.responses = { ...STATE.responses, ...s.responses };
  if (s.instrumentIdx != null) STATE.instrumentIdx = s.instrumentIdx;
  if (s.itemIdx != null)       STATE.itemIdx = s.itemIdx;
  if (s.view)           STATE.view = s.view;
  return true;
}

/* =====================================================================
   RENDER HELPERS
   ===================================================================== */

const $app = document.getElementById('app');

function el(html) {
  // Returns a DocumentFragment so templates with multiple top-level elements are preserved.
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[m]);
}

function totalItems() {
  return INSTRUMENT_ORDER.reduce((n, id) => n + INSTRUMENTS[id].items.length, 0);
}
function totalAnswered() {
  return INSTRUMENT_ORDER.reduce((n, id) => n + (STATE.responses[id] || []).filter(v => v != null).length, 0);
}

function isComplete() {
  return INSTRUMENT_ORDER.every(id =>
    (STATE.responses[id] || []).filter(v => v != null).length === INSTRUMENTS[id].items.length
  );
}

    STATE.responses = { bigFive: [], grit: [], via: [], efficacy: [], loc: [] };
    STATE.instrumentIdx = 0;
    STATE.itemIdx = 0;
    STATE.view = 'welcome';
    persist();
    renderWelcome();
  });
  const view = $app.querySelector('#view-report');
  if (view) view.addEventListener('click', () => {
    STATE.view = 'report';
    persist();
    renderReport();
  });
}

/* =====================================================================
   VIEW: RUNNER
   ===================================================================== */

function renderRunner() {
  const inst = INSTRUMENTS[INSTRUMENT_ORDER[STATE.instrumentIdx]];
  const item = inst.items[STATE.itemIdx];
  const responses = STATE.responses[inst.id] = STATE.responses[inst.id] || [];
  const selected = responses[STATE.itemIdx];
  const overall = totalAnswered();
  const pct = (overall / totalItems()) * 100;

  // Likert option labels: show ends + middle to reduce visual noise
  const labels = inst.labels;
  const optsHtml = labels.map((lbl, i) => {
    const val = i + 1;
    const sel = selected === val ? 'selected' : '';
    return `<button class="likert-opt ${sel}" data-val="${val}">
      <span class="num">${val}</span>
      <span class="lbl">${escapeHtml(lbl)}</span>
    </button>`;
  }).join('');

  // Prompt prefix
  const prefix = inst.id === 'bigFive' ? '<span class="small">I see myself as someone who…</span><br>' : '';

  $app.innerHTML = '';
  $app.appendChild(el(`
    <section class="card no-print">
      <div class="row between" style="margin-bottom:6px">
        <div class="small">${escapeHtml(inst.name)} — Question ${STATE.itemIdx + 1} of ${inst.items.length}</div>
        <div class="small">${overall} / ${totalItems()} overall</div>
      </div>
      <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>

      <p class="small" style="margin:4px 0 6px">${escapeHtml(inst.prompt)}</p>
      <div class="likert-q">${prefix}${escapeHtml(item.text)}</div>

      <div class="likert-scale ${inst.likert === 4 ? 'four' : ''}">${optsHtml}</div>

      <div class="row between" style="margin-top:14px">
        <button class="btn-ghost" id="back" ${STATE.instrumentIdx === 0 && STATE.itemIdx === 0 ? 'disabled' : ''}>← Back</button>
        <div class="row">
          <button class="btn-ghost" id="to-welcome">Save &amp; exit</button>
          <button class="btn-primary" id="next" ${selected == null ? 'disabled' : ''}>${isLastItem() ? 'Finish' : 'Next →'}</button>
        </div>
      </div>
    </section>
  `));

  $app.querySelectorAll('.likert-opt').forEach(node => {
    node.addEventListener('click', () => {
      const val = parseInt(node.dataset.val, 10);
      STATE.responses[inst.id][STATE.itemIdx] = val;
      persist();
      // Auto-advance for snappier flow
      if (isLastItem()) {
        // Just highlight and let user click Finish (avoids accidental jump to report)
        renderRunner();
      } else {
        advance();
        renderRunner();
      }
    });
  });
  $app.querySelector('#next').addEventListener('click', () => {
    if (isLastItem()) {
      STATE.view = 'report';
      persist();
      renderReport();
    } else {
      advance();
      renderRunner();
    }
  });
  $app.querySelector('#back').addEventListener('click', () => {
    retreat();
    renderRunner();
  });
  $app.querySelector('#to-welcome').addEventListener('click', () => {
    STATE.view = 'welcome';
    persist();
    renderWelcome();
  });
}

function isLastItem() {
  return STATE.instrumentIdx === INSTRUMENT_ORDER.length - 1 &&
         STATE.itemIdx === INSTRUMENTS[INSTRUMENT_ORDER[STATE.instrumentIdx]].items.length - 1;
}
function advance() {
  const inst = INSTRUMENTS[INSTRUMENT_ORDER[STATE.instrumentIdx]];
  if (STATE.itemIdx < inst.items.length - 1) {
    STATE.itemIdx++;
  } else if (STATE.instrumentIdx < INSTRUMENT_ORDER.length - 1) {
    STATE.instrumentIdx++;
    STATE.itemIdx = 0;
  }
  persist();
}
function retreat() {
  if (STATE.itemIdx > 0) {
    STATE.itemIdx--;
  } else if (STATE.instrumentIdx > 0) {
    STATE.instrumentIdx--;
    STATE.itemIdx = INSTRUMENTS[INSTRUMENT_ORDER[STATE.instrumentIdx]].items.length - 1;
  }
  persist();
}

/* =====================================================================
   VIEW: REPORT
   ===================================================================== */

function computeAllScores() {
  return {
    bigFive:  scoreInstrument(INSTRUMENTS.bigFive,  STATE.responses.bigFive),
    grit:     scoreInstrument(INSTRUMENTS.grit,     STATE.responses.grit),
    via:      scoreVia(INSTRUMENTS.via,             STATE.responses.via),
    efficacy: scoreInstrument(INSTRUMENTS.efficacy, STATE.responses.efficacy),
    loc:      scoreInstrument(INSTRUMENTS.loc,      STATE.responses.loc),
  };
}

function renderReport() {

  const scores = computeAllScores();

  $app.innerHTML = '';
  $app.appendChild(el(`
    <section class="card no-print">

        <button class="nav-tab ${STATE.reportTab === 'synthesis' ? 'active' : ''}" data-tab="synthesis">Synthesis</button>
        <button class="nav-tab ${STATE.reportTab === 'bigFive' ? 'active' : ''}" data-tab="bigFive">Big Five</button>
        <button class="nav-tab ${STATE.reportTab === 'grit' ? 'active' : ''}" data-tab="grit">Grit</button>
        <button class="nav-tab ${STATE.reportTab === 'via' ? 'active' : ''}" data-tab="via">Strengths</button>
        <button class="nav-tab ${STATE.reportTab === 'efficacy' ? 'active' : ''}" data-tab="efficacy">Self-Efficacy</button>
        <button class="nav-tab ${STATE.reportTab === 'loc' ? 'active' : ''}" data-tab="loc">Locus of Control</button>
      </div>
    </section>

    <div id="report-body"></div>

    <section class="card">
      <h3>About these results</h3>
      <p class="small">All instruments used here are published, peer-reviewed psychometrics with established validity and reliability. Your raw answers and scores stay in this browser only.</p>
      <ul class="citation-list">
        ${Object.values(INSTRUMENTS).map(i => `<li>${escapeHtml(i.name)} — ${escapeHtml(i.source)}</li>`).join('')}
      </ul>

  `));

  $app.querySelectorAll('.nav-tab').forEach(node => {
    node.addEventListener('click', () => {

  });
  $app.querySelector('#print-btn').addEventListener('click', () => window.print());
  $app.querySelector('#back-welcome').addEventListener('click', () => {

    persist();
    renderWelcome();
  });
  $app.querySelector('#toggle-persona').addEventListener('click', () => {
    STATE.persona = STATE.persona === 'business' ? 'career' : 'business';
    persist();
    renderReport();
  });

  const body = $app.querySelector('#report-body');
  switch (STATE.reportTab) {
    case 'synthesis': renderSynthesis(body, scores); break;
    case 'bigFive':   renderBigFive(body, scores);   break;
    case 'grit':      renderGrit(body, scores);      break;
    case 'via':       renderVia(body, scores);       break;
    case 'efficacy':  renderEfficacy(body, scores);  break;

}

function renderSynthesis(body, scores) {
  const results = THEMES.map(t => ({ theme: t, ...themeScore(t, scores) }));

  // Top 3 themes, bottom 3 themes (by score), for highlighting
  const sorted = [...results].sort((a, b) => b.score - a.score);
  const strongest = sorted.slice(0, 2);
  const weakest = [...results].sort((a, b) => a.score - b.score).slice(0, 2);

  // Theme cards
  const cardsHtml = results.map(r => {
    const interp = themeInterpretation(r.score);
    const desc = STATE.persona === 'business' ? r.theme.businessDesc : r.theme.careerDesc;
    const fillColor = interp.tone === 'high' ? 'var(--pos)' : (interp.tone === 'low' ? 'var(--warn)' : 'var(--accent)');
    return `
      <div class="theme-card">
        <h4>
          <span>${escapeHtml(r.theme.name)}</span>
          <span class="score-band ${interp.tone}">${interp.tag}</span>
        </h4>
        <div class="theme-bar"><div style="width:${r.score}%;background:${fillColor}"></div></div>
        <div class="theme-score">${r.score} / 100</div>
        <p>${escapeHtml(desc)}</p>
      </div>`;
  }).join('');

  body.innerHTML = '';
  body.appendChild(el(`
    <section class="card">
      <h3>Your synthesized profile</h3>
      <p class="lede">Six themes that matter for ${STATE.persona === 'business' ? 'building a business' : 'career growth'}, computed from across all five instruments.</p>
      <div id="theme-radar" class="chart-box"></div>
      <div class="theme-grid">${cardsHtml}</div>
    </section>

    <section class="card">
      <h3>What to lean into</h3>
      <p class="lede">${STATE.persona === 'business'
        ? 'These are themes where your natural profile gives you an edge. Build the business around them.'
        : 'These are themes where you\'re strongest. Lean into them when picking roles, projects, and pitches.'}</p>
      ${strongest.map(r => leverageBlock(r, scores)).join('')}
    </section>

    <section class="card">
      <h3>Where growth pays off most</h3>
      <p class="lede">${STATE.persona === 'business'
        ? 'These are themes where you\'re weakest — and they\'ll bottleneck the business if unaddressed. Either build the habit, or hire/partner for it.'
        : 'These are themes where development would unlock the most career impact. Pick one to work on this quarter.'}</p>
      ${weakest.map(r => growthBlock(r, scores)).join('')}
    </section>
  `));

  // Radar chart
  Plotly.newPlot('theme-radar', [{
    type: 'scatterpolar',
    r: results.map(r => r.score).concat([results[0].score]),
    theta: results.map(r => r.theme.name).concat([results[0].theme.name]),
    fill: 'toself',
    line: { color: '#2563eb', width: 2 },
    fillcolor: 'rgba(37,99,235,0.15)',
    hovertemplate: '%{theta}: %{r}/100<extra></extra>',
  }], {
    polar: {
      radialaxis: { visible: true, range: [0, 100], tickfont: { size: 10 } },
      angularaxis: { tickfont: { size: 11 } },
    },
    margin: { t: 30, b: 30, l: 30, r: 30 },
    showlegend: false,
    paper_bgcolor: 'transparent',
  }, { displayModeBar: false, responsive: true });
}

function leverageBlock(r, scores) {
  // For each strongest theme, name top contributing strengths
  const sorted = [...r.breakdown].sort((a, b) => b.pct - a.pct).slice(0, 2);
  const contributorsHtml = sorted.map(b => {
    const [inst, trait] = b.key.split('.');
    const label = inst === 'via'
      ? INSTRUMENTS.via.traitLabels[trait]
      : INSTRUMENTS[inst].traitLabels[trait];
    return `<span class="strength-pill">${escapeHtml(label)}</span>`;
  }).join('');
  return `
    <div class="growth-card" style="border-left-color:var(--pos);background:#f3fbf6">
      <div class="gc-title">${escapeHtml(r.theme.name)} — ${r.score}/100</div>
      <div class="gc-how">Strongest contributors: ${contributorsHtml}</div>
      <div class="gc-how" style="margin-top:8px">${escapeHtml(STATE.persona === 'business'
        ? 'In your business: position yourself in this lane. Hire to complement, not to duplicate.'
        : 'In your career: choose roles and projects that need this. Make it visible in your story.')}</div>
    </div>`;
}

function growthBlock(r, scores) {
  // Weakest contributor → growth action
  const weakest = r.breakdown[0]; // already sorted ascending in themeScore
  if (!weakest) return '';
  const [inst, trait] = weakest.key.split('.');
  const label = inst === 'via'
    ? INSTRUMENTS.via.traitLabels[trait]
    : INSTRUMENTS[inst].traitLabels[trait];

  // Determine band for that input
  let band = 'low';
  if (inst !== 'via') {
    const sc = scores[inst][trait];
    if (sc?.band) band = sc.band;
  } else {
    // VIA: weakness from the synthesis perspective = low strength
    band = 'low';
  }

  // Pull a growth action
  let action = null;
  if (inst === 'via') {
    // For VIA contributors, recommend developing this strength deliberately
    const amp = VIA_AMPLIFY[trait];
    action = amp ? {
      title: `Develop ${label}`,
      why: 'This strength is a contributor to the theme but is lower in your profile. Deliberate practice raises it.',
      how: amp.how,
      source: 'Peterson & Seligman (2004); Niemiec (2018), Character Strengths Interventions.',
    } : null;
  } else {
    const arr = GROWTH[trait]?.[band] || GROWTH[trait]?.low || [];
    action = arr[0];
  }

  const actionHtml = action ? `
    <div class="growth-card" style="margin-top:10px">
      <div class="gc-title">${escapeHtml(action.title)}</div>
      <div class="gc-why">${escapeHtml(action.why)}</div>
      <div class="gc-how"><b>How:</b> ${escapeHtml(action.how)}</div>
      <div class="gc-src">${escapeHtml(action.source)}</div>
    </div>` : '';

  return `
    <div class="growth-card" style="border-left-color:var(--warn);background:#fffbeb">
      <div class="gc-title">${escapeHtml(r.theme.name)} — ${r.score}/100</div>
      <div class="gc-how">Weakest contributor: <span class="strength-pill" style="background:var(--warn-soft);color:var(--warn)">${escapeHtml(label)}</span></div>
      ${actionHtml}
    </div>`;
}

      <div class="score-row">
        <div class="score-name">Internal LoC</div>
        <div class="score-track"><div class="score-fill ${sc.band}" style="width:${sc.pct}%"></div></div>
        <div class="score-band ${sc.band}">${sc.mean} / 5</div>
      </div>
    </section>
    <section class="card">
      <h3>Growth actions</h3>
      ${(GROWTH.internal[sc.band] || []).map(a => growthCardHtml(a)).join('') || '<p class="small">You\'re in a balanced band — well-calibrated agency without over-internalising.</p>'}
    </section>
  `));
}

/* =====================================================================
   INIT
   ===================================================================== */

restore();
// On first render, if user had a complete assessment, default to report
if (isComplete() && STATE.view === 'welcome') {
  // leave on welcome but offer the report button there
}

function route() {
  switch (STATE.view) {
    case 'runner': renderRunner(); break;
    case 'report': renderReport(); break;
    default: renderWelcome();
  }
}
route();
</script>
</body>
</html>
